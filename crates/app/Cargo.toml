[package]
name = "hs-dlx-app"
version.workspace = true
description = "Desktop application domain: task storage, task lifecycle and throttled progress over hs-m3u8-core and the BitTorrent engine, without any UI framework"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
base64.workspace = true
hs-dlx-cloud = { path = "../cloud" }
# 网页视频：yt-dlp 的组件安装与解析
hs-dlx-ytdlp = { path = "../ytdlp" }
hs-dlx-torrent = { path = "../torrent" }
hs-m3u8-core.workspace = true
icu_normalizer.workspace = true
minisign-verify.workspace = true
percent-encoding.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-util = { workspace = true, features = ["rt"] }

[dev-dependencies]
axum.workspace = true
rusqlite.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
