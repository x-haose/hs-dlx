[package]
name = "hs-dlx-webview"
version.workspace = true
description = "Native web views (wry) embedded in GPUI windows, with the web engine's cookie store"
edition.workspace = true
rust-version.workspace = true
license = "MIT AND Apache-2.0"
repository.workspace = true
publish = false

[dependencies]
gpui-kit.workspace = true
tokio = { workspace = true, features = ["sync"] }
url.workspace = true
# mac-proxy：macOS 上给网页设代理（14 起；别的平台上不起作用）
wry = { workspace = true, features = ["mac-proxy"] }

[target.'cfg(target_os = "macos")'.dependencies]
# 与 wry 0.57.2 用的同一版：取网页引擎的 Cookie 存储
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSBundle", "NSDate", "NSHTTPCookie", "NSKeyValueCoding", "NSProcessInfo", "NSString", "NSURLResponse"] }
objc2-web-kit = { version = "0.3.2", default-features = false, features = ["std", "block2", "objc2-app-kit", "WKHTTPCookieStore", "WKNavigationDelegate", "WKNavigationResponse", "WKWebView", "WKWebViewConfiguration", "WKWebsiteDataStore"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk.workspace = true
# 与 wry 0.57.2 用的同一版：取网页引擎的 Cookie 存储
soup3 = "0.5.0"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "windows")'.dependencies]
# 与 wry 0.57.2 用的同一版：取网页引擎的 Cookie 存储
webview2-com = "0.39.1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com"] }

# 这个 crate 把原生网页视图接进 GPUI 窗口、调各平台网页引擎的 Cookie 接口：借用平台的窗口句柄与调 Objective-C、COM
# 接口只能用 unsafe，所以不沿用工作区禁止 unsafe 的规则；其余 crate 照旧禁止。每个 unsafe 块都要写明为什么成立。
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
