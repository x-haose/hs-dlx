# 只为仓库里的 Python 脚本（scripts/：第三方声明、图标）与它们的测试提供开发工具；本项目不是 Python 包
[project]
name = "hs-dlx-tools"
version = "0"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
# 开发工具固定版本：类型检查与格式的结果随版本变化
dev = [
    "basedpyright==1.40.2",
    "mypy==2.4.0",
    # crates/ytdlp 的测试用它的 pip 把测试用的 yt-dlp 包装进组件目录，与应用用 python-build-standalone 带的 pip 同样调用
    "pip==26.3",
    "pytest==9.1.1",
    "ruff==0.17.0",
    # crates/ytdlp 的驱动脚本的测试对着本地网页跑真的 yt-dlp（通用解析器，不连外网）；应用运行时另从 PyPI 装
    "yt-dlp==2026.10.26",
    # scripts/runtime.py 把随应用带的 Python 打成 tar 经 zstd 压缩（应用用纯 Rust 的 ruzstd 解）
    "zstandard==0.25.0",
]

[tool.uv]
# uv 的版本：本地不符时 uv 报错，CI 的 setup-uv 照它安装
required-version = "==0.13.0"
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["scripts", "tests/scripts", "crates/ytdlp/src"]

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # 与 ruff format 冲突
    "COM812",
    # 文档字符串用中文，首行不按英文句号断句
    "D400",
    "D415",
    # D203/D213 与 D211/D212 互斥，取后者
    "D203",
    "D213",
    # 中文文本用全角标点
    "RUF001",
    "RUF002",
    "RUF003",
    # 许可证写在 LICENSE，文件头不放版权声明
    "CPY001",
]

[tool.ruff.lint.per-file-ignores]
# 测试用 assert 断言；测试函数的名字即说明
"tests/scripts/**" = ["S101", "D103"]
# 运行 PATH 里的 cargo（与 Makefile 一样），参数是写死的与 deny.toml 里的平台
"scripts/hs_m3u8.py" = ["S603", "S607"]
# 下载写死的 https 地址（锁定版本的 GitHub 发布）；运行 PATH 里的 rustc 与刚核对、解开的 Python 与 QuickJS-NG
"scripts/runtime.py" = ["S310", "S603", "S607"]
# yt-dlp 的驱动脚本：常驻解析时任何异常都要回给应用、进程接着服务（yt-dlp 只包住它认得的异常，网站改版后解析器
# 抛的 TypeError 等直接冒上来），所以按请求兜住 Exception；扩展名白名单只在 yt-dlp 的内部名字
# `yt_dlp.utils._utils._UnsafeExtensionError` 下，用它而不抄一份（随 yt-dlp 的安全修复更新），自检核对它还在
"crates/ytdlp/src/driver.py" = ["BLE001", "SLF001"]

[tool.mypy]
strict = true
files = ["scripts", "tests/scripts", "crates/ytdlp/src"]
# tests/scripts 下的测试按顶层模块导入 scripts 下的脚本与 yt-dlp 的驱动脚本
mypy_path = ["scripts", "crates/ytdlp/src"]
python_version = "3.12"

[tool.basedpyright]
include = ["scripts", "tests/scripts", "crates/ytdlp/src"]
extraPaths = ["scripts", "crates/ytdlp/src"]
pythonVersion = "3.12"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests/scripts"]
# tests/scripts 下的测试导入 scripts 下的脚本与 yt-dlp 的驱动脚本
pythonpath = ["scripts", "crates/ytdlp/src"]
addopts = ["--strict-markers", "--strict-config"]
# 警告即失败；预期的警告用 pytest.warns 断言
filterwarnings = ["error"]
xfail_strict = true
