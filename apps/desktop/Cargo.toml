[package]
name = "hs-dlx"
version.workspace = true
description = "Desktop downloader built with GPUI"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
dirs.workspace = true
fs4.workspace = true
gpui-kit.workspace = true
jiff.workspace = true
hs-dlx-app = { path = "../../crates/app" }
hs-m3u8-core.workspace = true
hs-dlx-instance = { path = "../../crates/instance" }
hs-dlx-macos = { path = "../../crates/macos" }
hs-dlx-relay = { path = "../../crates/relay" }
hs-dlx-webview = { path = "../../crates/webview" }
hs-dlx-scene = { path = "../../crates/scene" }
# 背景的每一帧交给 GPUI 时用它的帧类型；与 gpui-pre 用的同一版，不另编一份
image = { version = "0.25.10", default-features = false }
percent-encoding.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
# 托盘图标：0.x 近一年有两次不兼容升级，精确锁定；Linux 用 ksni 后端（StatusNotifierItem，纯 Rust 的 D-Bus），不要
# 默认的 GTK 与 libappindicator
tray-icon = { version = "=0.26.1", default-features = false, features = ["ksni"] }
url.workspace = true
wry.workspace = true

# 把 Windows 的图标资源（app.rc）编进程序：资源号 1 的图标是程序文件、窗口与任务栏的图标（GPUI 按它载入）
[build-dependencies]
embed-resource = "=3.0.12"

[lints]
workspace = true

# 安装包（cargo-packager，版本见 .github/workflows/desktop.yml）：macOS 出 .app 与 .dmg，Windows 出 NSIS 安装程序（装在
# 当前用户下，不要管理员），Linux 出 deb（按平台指定格式，见 Makefile 的 PACKAGE_FORMATS）。第三方声明当作资源放进去（各平台的位置见
# settings.rs 的 installed_notices）
[package.metadata.packager]
product-name = "hs-dlx"
identifier = "io.github.x-haose.hs-dlx"
description = "HLS（m3u8）视频下载器：点播、直播录制、在网页里找视频流"
before-packaging-command = "cargo build --release --locked -p hs-dlx"
# macOS 上打 dmg 之前给 .app 签名、公证（设了签名身份时，见 scripts/macos_sign.py）；别的格式与平台什么也不做。脚本只用
# 标准库，不依赖项目的虚拟环境建没建；Python 版本同 pyproject.toml 的 requires-python
before-each-package-command = { script = "uv run --no-project --python 3.12 python -I scripts/macos_sign.py hook target/release/hs-dlx.app", dir = "../.." }
out-dir = "../../target/release"
binaries = [{ path = "hs-dlx", main = true }]
icons = [
  "assets/icons/32.png",
  "assets/icons/32@2x.png",
  "assets/icons/128.png",
  "assets/icons/128@2x.png",
  "assets/icons/256.png",
  "assets/icons/256@2x.png",
  "assets/icons/512.png",
  "assets/icons/512@2x.png",
]
resources = [{ src = "LICENSES", target = "LICENSES" }]

# 与 hs-m3u8 的 FFmpeg 构建脚本（third_party/ffmpeg/build.sh）的 MACOSX_DEPLOYMENT_TARGET 一致：随带的 FFmpeg 按它编译
[package.metadata.packager.macos]
minimum-system-version = "11.0"

[package.metadata.packager.nsis]
installer-icon = "assets/icons/icon.ico"

[package.metadata.packager.deb]
# 网页嵌入（WebKitGTK）与窗口（GTK、xkbcommon）用到的系统库
depends = ["libwebkit2gtk-4.1-0", "libgtk-3-0", "libxkbcommon-x11-0"]
